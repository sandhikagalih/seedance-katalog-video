<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · WPU Store Video Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="eyebrow">WPU STORE / VIDEO STUDIO</div>
    <h1>Masuk ke ruang tim.</h1>
    <p>Gunakan akun tim untuk mengakses katalog dan membuat video.</p>
    <form id="login-form">
      <label>Email<input name="email" type="email" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="button primary full" type="submit">Masuk</button>
    </form>
  </main>
</body>
</html>
